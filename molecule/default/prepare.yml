---
- name: Prepare ArtiDezi worker Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for ArtiDezi worker Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for ArtiDezi worker Molecule tests preparation
      ansible.builtin.package:
        name:
          - git
          - python3-requests
        state: present

    - name: Ensure Docker is installed for ArtiDezi worker Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
