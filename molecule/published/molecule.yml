---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: artidezi-worker-${MOLECULE_DISTRO:-ubuntu2604}-published
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Docker inside the instance stores images via containerd.
      # Its storage cannot use overlay on top of the instance's own overlay filesystem, so a volume puts it on a real filesystem.
      - /var/lib/containerd
    # Remove volumes along with the instance, so that local runs do not leave gigabytes behind.
    keep_volumes: false
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ../default/prepare.yml
    converge: ../default/converge.yml
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        artidezi_worker_uid: 1234
        artidezi_worker_gid: 1235
        # Nothing listens there: the worker has to keep retrying.
        artidezi_worker_orchestrator_url: https://127.0.0.1:9
        artidezi_worker_token: molecule-worker-token-7f3a
        artidezi_worker_pool: molecule
        artidezi_worker_poll_seconds: 2
        # The image has no harness, and nothing asks for a customized one. Anything answering `--version` satisfies the worker.
        artidezi_worker_codex_binary: /usr/bin/git
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
